name: Subscription Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * MON"   # Every Monday at 9 AM

jobs:
  run-subscriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Run onboarding
        run: python subscriptions/onboarding.py
      - name: Run subscription manager
        run: python subscriptions/subscription_manager.py