name: Security & Compliance Automation

on:
  schedule:
    - cron: "0 2 * * SUN"   # Every Sunday at 2 AM
  workflow_dispatch:

jobs:
  run-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run backup manager
        run: python security/backup_manager.py
      - name: Run compliance checker
        run: python security/compliance_checker.py