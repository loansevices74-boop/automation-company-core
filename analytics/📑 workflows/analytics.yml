name: Analytics & AI Insights

on:
  schedule:
    - cron: "0 7 * * MON"   # Every Monday at 7 AM
  workflow_dispatch:

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Run analyzer
        run: python analytics/analyzer.py
      - name: Run insights generator
        run: python analytics/insights_generator.py