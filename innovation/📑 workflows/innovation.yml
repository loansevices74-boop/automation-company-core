name: Innovation Automation

on:
  schedule:
    - cron: "0 12 * * SAT"   # Every Saturday at 12 PM
  workflow_dispatch:

jobs:
  run-innovation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Generate idea
        run: python innovation/idea_generator.py
      - name: Test prototype
        run: python innovation/prototype_tester.py
      - name: Log innovation
        run: python innovation/innovation_pipeline.py