name: Deploy Chatbot

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-chatbot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Rasa
        run: pip install rasa
      - name: Train chatbot
        run: rasa train
      - name: Run chatbot
        run: rasa run --enable-api --port 5005