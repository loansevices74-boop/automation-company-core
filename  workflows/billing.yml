name: Billing Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * MON"   # Every Monday at 10 AM

jobs:
  run-billing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Generate invoice
        run: python billing/invoice_generator.py
      - name: Log payment
        run: python billing/payment_tracker.py