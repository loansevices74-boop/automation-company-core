name: CRM Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * FRI"   # Every Friday at 12 PM

jobs:
  run-crm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Run CRM manager
        run: python crm/crm_manager.py