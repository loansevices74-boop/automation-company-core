name: Client SaaS Portal Automation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install flask pandas pyyaml
      - name: Run portal
        run: python portal/app.py