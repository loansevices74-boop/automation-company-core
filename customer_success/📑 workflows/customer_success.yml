name: Customer Success Automation

on:
  schedule:
    - cron: "0 16 * * MON"   # Every Monday at 4 PM
  workflow_dispatch:

jobs:
  run-customer-success:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run health score
        run: python customer_success/health_score.py
      - name: Run churn predictor
        run: python customer_success/churn_predictor.py
      - name: Run engagement trigger
        run: python customer_success/engagement_trigger.py