name: Growth Optimization Automation

on:
  schedule:
    - cron: "0 11 * * FRI"   # Every Friday at 11 AM
  workflow_dispatch:

jobs:
  run-growth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Run A/B tests
        run: python growth/ab_test.py
      - name: Track performance
        run: python growth/performance_tracker.py