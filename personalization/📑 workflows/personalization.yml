name: Personalization Automation

on:
  schedule:
    - cron: "0 8 * * THU"   # Every Thursday at 8 AM
  workflow_dispatch:

jobs:
  run-personalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Run recommender
        run: python personalization/recommender.py
      - name: Run personalization engine
        run: python personalization/personalization_engine.py