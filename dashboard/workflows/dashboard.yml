name: Admin Dashboard Automation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install streamlit pandas pyyaml
      - name: Run dashboard
        run: streamlit run dashboard/app.py --server.port 8501