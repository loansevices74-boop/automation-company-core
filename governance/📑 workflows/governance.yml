name: Governance Automation

on:
  schedule:
    - cron: "0 9 * * MON"   # Every Monday at 9 AM
  workflow_dispatch:

jobs:
  run-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Run policy enforcer
        run: python governance/policy_enforcer.py
      - name: Run audit logger
        run: python governance/audit_logger.py
      - name: Run RBAC manager
        run: python governance/rbac_manager.py