name: Ecosystem Integration Automation

on:
  schedule:
    - cron: "0 13 * * TUE"   # Every Tuesday at 1 PM
  workflow_dispatch:

jobs:
  run-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests pyyaml
      - name: Run API connector
        run: python ecosystem/api_connector.py
      - name: Run marketplace integration
        run: python ecosystem/marketplace_integration.py