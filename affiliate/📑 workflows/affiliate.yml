name: Affiliate Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * MON"   # Every Monday at 2 PM

jobs:
  run-affiliate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyyaml
      - name: Run affiliate manager
        run: python affiliate/affiliate_manager.py
      - name: Run referral tracker
        run: python affiliate/referral_tracker.py