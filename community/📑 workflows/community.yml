name: Community Engagement Automation

on:
  schedule:
    - cron: "0 15 * * WED"   # Every Wednesday at 3 PM
  workflow_dispatch:

jobs:
  run-community:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests pandas pyyaml
      - name: Run forum bot
        run: python community/forum_bot.py
      - name: Run feedback collector
        run: python community/feedback_collector.py